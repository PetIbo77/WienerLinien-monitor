<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiener Linien Monitor - 6 Felder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="top-bar">
        <div id="zeit-box">
            <p id="uhr">00:00</p>
            <p id="datum">Lade...</p>
        </div>
        <div class="linie-card meidlinghpt">
            <p><b>Meidling Hauptstraße</b></p>
            <width: 50px; height: 50px;>
        </div>
        <div class="linie-card meidling">
            <p><b>Meidling</b></p>
            <width: 80px; height: 50px;>
        </div>
        <div id="wetter-box">--°C</div>
    </div>

    <div class="monitor-grid">
        
        <div class="linie-card meidlinghpt">
            <div>
                <div class="linie-name">9A</div>
                <div class="linie-richtung"><b>Meidling Hauptstraße</b></div>
            </div>
            <div class="abfahrt-zeit" id="zeit1">-- min</div>
        </div>

        <div class="linie-card bus-tram">
            <div>
                <div class="linie-name">9A</div>
                <div class="linie-richtung"><b>Meidling</b></div>
            </div>
            <div class="abfahrt-zeit" id="zeit2">-- min</div>
        </div>

        <div class="linie-card meidlinghpt">
            <div>
                <div class="linie-name">63A</div>
                <div class="linie-richtung"><b>Meidling Hauptstraße</b></div>
            </div>
            <div class="abfahrt-zeit" id="zeit3">-- min</div>
        </div>

        <div class="linie-card meidlinghpt">
            <div>
                <div class="linie-name">7A</div>
                <div class="linie-richtung"><b>Meidling Hauptstraße</b></div>
            </div>
            <div class="abfahrt-zeit" id="zeit4">-- min</div>
        </div>

        <div class="linie-card bus-tram">
            <div>
                <div class="linie-name">7A</div>
                <div class="linie-richtung"><b>Reumanplatz</b></div>
            </div>
            <div class="abfahrt-zeit" id="zeit5">-- min</div>
        </div>

        <div class="linie-card u4">
            <div>
                <div class="linie-name">U4</div>
                <div class="linie-richtung"><b>Heiligenstadt</b></div>
            </div>
            <div class="abfahrt-zeit" id="zeit6">-- min</div>
        </div>

    </div>

    <script>
        // ==========================================
        // HIER DEINE 6 SELBST GESUCHTEN RBL-NUMMERN EINTRAGEN
        // ==========================================
        const rbls = {
            rbl1: "3203",
            rbl2: "3217",
            rbl3: "1789",
            rbl4: "1838",
            rbl5: "1801",
            rbl6: "4413"
        };

        // 1. Uhrzeit & Datum Funktion
        function updateUhr() {
            const jetzt = new Date();
            const optionen = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('uhr').innerText = `${String(jetzt.getHours()).padStart(2, '0')}:${String(jetzt.getMinutes()).padStart(2, '0')}`;
            document.getElementById('datum').innerText = jetzt.toLocaleDateString('de-AT', optionen);
        }
        setInterval(updateUhr, 1000); 
        updateUhr(); // Sofort einmal starten

        // 2. Wetter Funktion
        async function holeWetter() {
        try {
            const antw = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=48.208&longitude=16.372&current_weather=true`);
            const daten = await antw.json();
            document.getElementById('wetter-box').innerText = `${Math.round(daten.current_weather.temperature)}°C`;
        } catch (f) { 
            console.error("Wetter Fehler:", f); 
        }
        }
        setInterval(holeWetter, 900000); 
        holeWetter(); // Sofort einmal starten

        // 3. Funktion für eine einzelne Haltestelle
        async function holeEinzelneAbfahrt(rblId, elementId) {
        try {
            const antwort = await fetch(`https://corsproxy.io/?url=http://realtime.wienerlinien.at/ogd_realtime/monitor?rbl=${rblId}`);
            const daten = await antwort.json();
        
        // Wir gehen ganz tief in die Datenstruktur der Wiener Linien rein
            if (daten && daten.data && daten.data.monitors) {
                const monitor = daten.data.monitors[0];
            
                if (monitor && monitor.lines && monitor.lines[0]) {
                    const linie = monitor.lines[0];
                
                // Falls es geplante Abfahrten gibt
                    if (linie.departures && linie.departures.departure) {
                        const countdown = linie.departures.departure[0].departureTime.countdown;
                        document.getElementById(elementId).innerText = `${countdown} min`;
                        return;
                } 
                // Falls keine Live-Daten da sind, aber Fahrplandaten
                    else if (linie.background && linie.background.title) {
                        document.getElementById(elementId).innerText = "Keine Fahrt";
                        return;
                }
            }
        }
        document.getElementById(elementId).innerText = "Nicht aktiv";
    } catch (e) {
        console.error("Fehler bei RBL " + rblId, e);
        document.getElementById(elementId).innerText = "Err";
    }
    }

    // 4. Hauptfunktion für alle 6 Abfahrten nacheinander
    async function holeAlleAbfahrten() {
        const keys = ['rbl1', 'rbl2', 'rbl3', 'rbl4', 'rbl5', 'rbl6'];
        for (let i = 0; i < keys.length; i++) {
            // 1 Sekunde Pause zwischen den Stationen, um die API zu schonen
            await new Promise(resolve => setTimeout(resolve, 1000)); 
            holeEinzelneAbfahrt(rbls[keys[i]], `zeit${i+1}`);
        }
    }

    // Alle 25 Sekunden neu laden
    setInterval(holeAlleAbfahrten, 25000);
    // WICHTIG: Sofort beim Laden der Seite einmal ausführen!
    holeAlleAbfahrten();
    </script>
</body>
</html>
